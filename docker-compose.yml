# Lab 9 runtime: Postgres (lab_user databases), RabbitMQ, Elasticsearch 8,
# Eureka, Pricing, Policy, and Policy Search.
# Build context for the .NET images is the repository root.
services:
  postgres:
    build:
      context: ./postgres/postgres
    environment:
      POSTGRES_PASSWORD: lab_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbit:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      ingest.geoip.downloader.enabled: "false"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
    build:
      context: ./eureka-server/eureka-server
      dockerfile: Dockerfile.maven
    ports:
      - "8761:8761"

  pricing:
    build:
      context: .
      dockerfile: src/PricingService/PricingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:5040
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "5040:5040"

  policy:
    build:
      context: .
      dockerfile: src/PolicyService/PolicyService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:5050
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      pricing:
        condition: service_started
    ports:
      - "5050:5050"

  policy-search:
    build:
      context: .
      dockerfile: src/PolicySearchService/PolicySearchService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:5065
    depends_on:
      rabbit:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "5065:5065"
