# BTH9 — hạ tầng + toàn bộ microservice.
# Hạ tầng:  docker compose up -d postgres rabbit elasticsearch eureka-server
# Cả hệ thống: docker compose up -d --build

services:
  postgres:
    build: ./postgres/postgres
    image: insurance-postgres
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: lab_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbit:
    image: rabbitmq:3-management
    container_name: rabbit
    hostname: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./scripts/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
    build: ./eureka-server/eureka-server
    image: eureka-server
    container_name: eureka-server
    hostname: eureka-server
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/AuthService/Dockerfile
    image: dotnet-auth-service
    container_name: dotnet-auth-service
    hostname: dotnet-auth-service
    ports:
      - "6060:6060"
    depends_on:
      - eureka-server

  product-service:
    build:
      context: .
      dockerfile: src/ProductService/ProductService/Dockerfile
    image: dotnet-product-service
    container_name: dotnet-product-service
    hostname: dotnet-product-service
    ports:
      - "5030:5030"
    depends_on:
      - eureka-server

  pricing-service:
    build:
      context: .
      dockerfile: src/PricingService/PricingService/Dockerfile
    image: dotnet-pricing-service
    container_name: dotnet-pricing-service
    hostname: dotnet-pricing-service
    # Trong container van lang nghe 5040 (Eureka/appsettings.docker). Host map mac dinh 15040
    # tranh xung dot Windows CDPSvc (svchost) chiem 0.0.0.0:5040 — dat PRICING_HOST_PORT trong .env neu can.
    ports:
      - "${PRICING_HOST_PORT:-15040}:5040"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started

  policy-service:
    build:
      context: .
      dockerfile: src/PolicyService/PolicyService/Dockerfile
    image: dotnet-policy-service
    container_name: dotnet-policy-service
    hostname: dotnet-policy-service
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  policy-search-service:
    build:
      context: .
      dockerfile: src/PolicySearchService/PolicySearchService/Dockerfile
    image: dotnet-policy-search-service
    container_name: dotnet-policy-search-service
    hostname: dotnet-policy-search-service
    ports:
      - "5065:5065"
    depends_on:
      rabbit:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: src/ChatService/ChatService/Dockerfile
    image: dotnet-chat-service
    container_name: dotnet-chat-service
    hostname: dotnet-chat-service
    ports:
      - "4099:4099"
    depends_on:
      rabbit:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/PaymentService/Dockerfile
    image: dotnet-payment-service
    container_name: dotnet-payment-service
    hostname: dotnet-payment-service
    ports:
      - "5070:5070"
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    restart: unless-stopped

  dashboard-service:
    build:
      context: .
      dockerfile: src/DashboardService/DashboardService/Dockerfile
    image: dotnet-dashboard-service
    container_name: dotnet-dashboard-service
    hostname: dotnet-dashboard-service
    ports:
      - "5035:5035"
    depends_on:
      rabbit:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: AgentPortalApiGateway/AgentPortalApiGateway/Dockerfile
    image: dotnet-agent-portal-gateway
    container_name: dotnet-agent-portal-gateway
    hostname: dotnet-agent-portal-gateway
    ports:
      - "8099:8099"
    depends_on:
      - eureka-server
      - auth-service
      - product-service
      - policy-service
      - policy-search-service
      - pricing-service
      - dashboard-service

  blazor:
    build:
      context: .
      dockerfile: BlazorWasmClient/Dockerfile
    image: dotnet-blazor-client
    container_name: dotnet-blazor-client
    ports:
      - "5081:80"
    depends_on:
      - gateway
      - auth-service
      - chat-service
