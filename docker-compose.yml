# Lab 9. Context .NET images that COPY src/... is the repository root.
# Host port 5040 is left free (Windows CDPSvc). Inside the network Pricing stays on 5040.
# Compose Postgres is published on 5432 and does not use host port 5433.
services:
  postgres:
    build:
      context: ./postgres/postgres
    environment:
      POSTGRES_PASSWORD: lab_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbit:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      ingest.geoip.downloader.enabled: "false"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
    build:
      context: ./eureka-server/eureka-server
      dockerfile: Dockerfile.maven
    ports:
      - "8761:8761"

  auth:
    build:
      context: ./src/AuthService
      dockerfile: AuthService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:6060
    ports:
      - "6060:6060"

  product:
    build:
      context: ./src/ProductService
      dockerfile: ProductService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:5030
    depends_on:
      eureka-server:
        condition: service_started
    ports:
      - "5030:5030"

  pricing:
    build:
      context: .
      dockerfile: src/PricingService/PricingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:5040
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "15040:5040"

  policy:
    build:
      context: .
      dockerfile: src/PolicyService/PolicyService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:5050
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      pricing:
        condition: service_started
      eureka-server:
        condition: service_started
    ports:
      - "5050:5050"

  policy-search:
    build:
      context: .
      dockerfile: src/PolicySearchService/PolicySearchService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:5065
    depends_on:
      rabbit:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "5065:5065"

  gateway:
    build:
      context: ./AgentPortalApiGateway
      dockerfile: AgentPortalApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      ASPNETCORE_URLS: http://+:8099
    depends_on:
      eureka-server:
        condition: service_started
      product:
        condition: service_started
      policy:
        condition: service_started
      policy-search:
        condition: service_started
    ports:
      - "8099:8099"

  web:
    build:
      context: ./Web/Web
      dockerfile: Dockerfile
    depends_on:
      gateway:
        condition: service_started
      auth:
        condition: service_started
    ports:
      - "8080:80"
