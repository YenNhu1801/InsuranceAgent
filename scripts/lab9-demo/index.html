<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Lab 9 — Đại lý bảo hiểm</title>
  <style>
    body { font-family: Georgia, serif; margin: 24px; background: #f4f1ea; color: #1c1915; }
    h1 { font-size: 28px; margin-bottom: 4px; }
    p { max-width: 760px; }
    button { font: inherit; margin: 0 8px 8px 0; padding: 8px 14px; background: #1f4b3a; color: #fff; border: 0; cursor: pointer; }
    pre { background: #fff; border: 1px solid #d9d2c5; padding: 12px; white-space: pre-wrap; min-height: 48px; }
    .row { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Lab 9 — tạo hợp đồng và tìm kiếm</h1>
  <p>Dữ liệu giả lập. Pricing :5040, Policy :5050, Policy Search :5065, Payment :5070.</p>
  <div class="row">
    <button id="offer">1. Tạo báo giá du lịch TRI</button>
    <button id="buy" disabled>2. Chuyển thành hợp đồng</button>
    <button id="search" disabled>3. Tìm hợp đồng</button>
    <button id="pay" disabled>4. Xem tài khoản thanh toán</button>
  </div>
  <pre id="out">Chưa gọi API.</pre>
  <script>
    const out = document.getElementById("out");
    let offerNumber = "";
    let policyNumber = "";
    function show(title, value) {
      out.textContent = title + "\n" + (typeof value === "string" ? value : JSON.stringify(value, null, 2));
    }
    async function call(path, options) {
      const res = await fetch(path, options);
      const text = await res.text();
      let body = text;
      try { body = JSON.parse(text); } catch (e) {}
      if (!res.ok) throw new Error(res.status + " " + text);
      return body;
    }
    document.getElementById("offer").onclick = async () => {
      const body = await call("/up/policy/api/Offer", {
        method: "POST",
        headers: { "Content-Type": "application/json", "AgentLogin": "agent.demo" },
        body: JSON.stringify({
          productCode: "TRI",
          policyFrom: "2026-12-01T00:00:00",
          policyTo: "2026-12-15T00:00:00",
          selectedCovers: ["C1", "C2"],
          answers: [
            { questionCode: "NUM_OF_ADULTS", questionType: "Numeric", answer: 2 },
            { questionCode: "NUM_OF_CHILDREN", questionType: "Numeric", answer: 1 },
            { questionCode: "DESTINATION", questionType: "Choice", answer: "EUR" }
          ]
        })
      });
      offerNumber = body.offerNumber;
      document.getElementById("buy").disabled = false;
      show("Báo giá đã lưu. Giá từ Pricing Service.", body);
    };
    document.getElementById("buy").onclick = async () => {
      const body = await call("/up/policy/api/Policy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          offerNumber,
          policyHolder: { firstName: "Ha", lastName: "Le", taxId: "00444555666" },
          policyHolderAddress: { country: "VN", zipCode: "70000", city: "Ho Chi Minh", street: "15 Demo Street" }
        })
      });
      policyNumber = body.policyNumber;
      const details = await call("/up/policy/api/Policy/" + encodeURIComponent(policyNumber));
      document.getElementById("search").disabled = false;
      document.getElementById("pay").disabled = false;
      show("Hợp đồng đã tạo.", { created: body, details });
    };
    document.getElementById("search").onclick = async () => {
      let last = null;
      for (let i = 0; i < 12; i++) {
        last = await call("/up/search/api/PolicySearch?q=" + encodeURIComponent(policyNumber));
        if (last.policies && last.policies.length) break;
        await new Promise(r => setTimeout(r, 1000));
      }
      show("Kết quả Elasticsearch.", last);
    };
    document.getElementById("pay").onclick = async () => {
      let last = null;
      for (let i = 0; i < 10; i++) {
        const res = await fetch("/up/payment/api/Payment/accounts/" + encodeURIComponent(policyNumber));
        const text = await res.text();
        last = text;
        if (res.ok) break;
        await new Promise(r => setTimeout(r, 1000));
      }
      show("Tài khoản thanh toán sau sự kiện PolicyCreated.", last);
    };
  </script>
</body>
</html>
